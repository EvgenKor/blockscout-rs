[workspace]
resolver = "2"
members = [
    "tac-indexer-logic",
    "tac-indexer-entity",
    "tac-indexer-migration",
    "tac-indexer-proto",
    "tac-indexer-server",
]

[workspace.dependencies]
actix-prost = { git = "https://github.com/blockscout/actix-prost"}
actix-prost-build = { git = "https://github.com/blockscout/actix-prost"}
actix-prost-macros = { git = "https://github.com/blockscout/actix-prost"}
actix-web = "4"
anyhow = "1.0"
async-std = "1"
async-trait = "0.1"
blockscout-service-launcher = { version = "0.16.2", default-features = false, features = ["database-1_0", "test-server", "test-database", "tracing"] }
config = "0.14"
pretty_assertions = "1.3"
prost = "0.11"
prost-build = "0.11"
reqwest = "0.12"
sea-orm = "1.1.0"
sea-orm-migration = "1.1.0"
serde = "1"
serde_json = "1.0.96"
serde_with = "2.0"
tokio = "1.23"
tonic = "0.8"
tonic-build = "0.8"
tracing = "0.1"

